name: activation

on:
  push:
    branches: [main, codex/release-completion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  archive-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check chunk 00
        run: echo '50099f63abcae2a3a3ae728e4165aa5b16fb3ded  release/xz/part-00.b64' | sha1sum -c -
      - name: Check chunk 01
        if: always()
        run: echo '95946808a11f1fb2e387474149abf4c52a877144  release/xz/part-01.b64' | sha1sum -c -
      - name: Check chunk 02
        if: always()
        run: echo 'bfbf41a35d3b990a9391c4b2fef4a4d288bcd1ec  release/xz/part-02.b64' | sha1sum -c -
      - name: Check chunk 03
        if: always()
        run: echo 'c6f39f9190a081d963b5316c8b967db4668e6d2d  release/xz/part-03.b64' | sha1sum -c -
      - name: Check chunk 04
        if: always()
        run: echo 'f4a9b783a489cbb2645b8a6bc7a9a07aaceb15e9  release/xz/part-04.b64' | sha1sum -c -

  verify-recovered-release:
    runs-on: ubuntu-latest
    needs: archive-integrity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct recovered source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .recovered/source
          cat release/xz/part-*.b64 | base64 --decode > .recovered/source.tar.xz
          echo '6bd60f613fcf2bce55971eb1d4deb3470ee16eba7f2c76d10a2abdd8086b63a4  .recovered/source.tar.xz' | sha256sum -c -
          xz --test .recovered/source.tar.xz
          tar -xJf .recovered/source.tar.xz -C .recovered/source
      - name: Install dependencies
        working-directory: .recovered/source
        run: npm install --no-audit --no-fund
      - name: Test
        working-directory: .recovered/source
        run: npm test
      - name: Typecheck
        working-directory: .recovered/source
        run: npm run typecheck
      - name: Smoke
        working-directory: .recovered/source
        run: npm run smoke
      - name: Evaluations
        working-directory: .recovered/source
        run: npm run eval
      - name: Release verifier
        working-directory: .recovered/source
        run: npm run verify:release

  container-build:
    runs-on: ubuntu-latest
    needs: archive-integrity
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct recovered source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .recovered/source
          cat release/xz/part-*.b64 | base64 --decode > .recovered/source.tar.xz
          echo '6bd60f613fcf2bce55971eb1d4deb3470ee16eba7f2c76d10a2abdd8086b63a4  .recovered/source.tar.xz' | sha256sum -c -
          tar -xJf .recovered/source.tar.xz -C .recovered/source
      - name: Docker build
        working-directory: .recovered/source
        run: docker build --tag tradewind-autonomous-dealflow:ci .
