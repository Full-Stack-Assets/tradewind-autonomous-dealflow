name: activation

on:
  push:
    branches: [main, codex/release-completion]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-recovered-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Reconstruct recovered source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .recovered/source
          cat release/xz/part-*.b64 | base64 --decode > .recovered/source.tar.xz
          sha256sum .recovered/source.tar.xz
          xz --test .recovered/source.tar.xz
          tar -xJf .recovered/source.tar.xz -C .recovered/source
      - name: Install dependencies
        working-directory: .recovered/source
        run: npm install --no-audit --no-fund
      - name: Test
        working-directory: .recovered/source
        run: npm test
      - name: Typecheck
        working-directory: .recovered/source
        run: npm run typecheck
      - name: Smoke
        working-directory: .recovered/source
        run: npm run smoke
      - name: Evaluations
        working-directory: .recovered/source
        run: npm run eval
      - name: Release verifier
        working-directory: .recovered/source
        run: npm run verify:release

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct recovered source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .recovered/source
          cat release/xz/part-*.b64 | base64 --decode > .recovered/source.tar.xz
          sha256sum .recovered/source.tar.xz
          xz --test .recovered/source.tar.xz
          tar -xJf .recovered/source.tar.xz -C .recovered/source
      - name: Docker build
        working-directory: .recovered/source
        run: docker build --tag tradewind-autonomous-dealflow:ci .
